<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor RAD de Páginas HTML</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <h1>RAD Web Builder</h1>
    <div class="header-actions">
      <button id="toggle-grid" class="ghost">Grade</button>
      <button id="clear-canvas" class="danger">Limpar Canvas</button>
    </div>
  </header>
  <main class="app-layout">
    <aside class="component-bar">
      <h2>Componentes</h2>
      <div id="component-list" class="component-list"></div>
    </aside>

    <section class="canvas-wrapper">
      <div id="canvas" class="canvas" tabindex="0" aria-label="Área de design"></div>
      <div class="canvas-hint">Clique em um componente para selecioná-lo. Use duplo clique para editar texto diretamente.</div>
    </section>

    <aside class="inspector" id="inspector">
      <div class="inspector-section">
        <h2>Elemento selecionado</h2>
        <div class="inspector-fields" id="element-info">
          <p>Nenhum elemento selecionado.</p>
        </div>
      </div>

      <div class="inspector-section" id="properties-section">
        <h2>Propriedades</h2>
        <form id="property-form" class="inspector-form"></form>
      </div>

      <div class="inspector-section" id="styles-section">
        <div class="inspector-section-header">
          <h2>CSS</h2>
          <button type="button" id="add-style" class="ghost small">+ Propriedade</button>
        </div>
        <form id="style-form" class="inspector-form"></form>
      </div>

      <div class="inspector-section" id="events-section">
        <h2>Eventos</h2>
        <div id="event-list" class="event-list"></div>
      </div>
    </aside>
  </main>

  <template id="event-template">
    <div class="event-item">
      <label>
        <span class="event-name"></span>
        <textarea class="event-code" spellcheck="false" placeholder="function (event) { \n  // Seu código aqui\n}"></textarea>
      </label>
    </div>
  </template>

  <template id="style-row-template">
    <div class="style-row">
      <input type="text" class="style-key" placeholder="propriedade" />
      <input type="text" class="style-value" placeholder="valor" />
      <button type="button" class="icon-button remove-style" title="Remover propriedade">×</button>
    </div>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
